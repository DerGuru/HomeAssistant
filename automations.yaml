- id: '1736946120721'
  alias: Büro OG Fenster auf bei offener Tür
  description: Das Fenster in Julias Büro wird geöffnet, während es draussen kalt
    ist. Sie lässt dabei gerne mal die Tür offen und es wird im ganzen Haus kalt.
  triggers:
  - trigger: state
    entity_id: binary_sensor.arbeitszimmer_og_fenster_window
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.arbeitszimmer_og_tur_window
    to: 'on'
  conditions:
  - condition: numeric_state
    entity_id: sensor.heizung_aussentemp
    below: 15
    enabled: false
  actions:
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - alias: Fenster auf heißt Tür zu!
    repeat:
      while:
      - condition: and
        conditions:
        - condition: state
          entity_id: binary_sensor.arbeitszimmer_og_fenster_window
          state: 'on'
        - condition: state
          entity_id: binary_sensor.arbeitszimmer_og_tur_window
          state: 'on'
      sequence:
      - action: script.tts_with_volume
        data:
          target_volume: 0.8
          target_device: 967db56538466d8a21b62255d71f806d
          msg: Fenster auf heißt Tür zu!
        alias: Fenster auf heißt Tür zu!
        enabled: true
      - delay:
          hours: 0
          minutes: 0
          seconds: 30
          milliseconds: 0
    enabled: false
  - if:
    - condition: and
      conditions:
      - condition: state
        entity_id: binary_sensor.arbeitszimmer_og_fenster_window
        state: 'on'
      - condition: state
        entity_id: binary_sensor.arbeitszimmer_og_tur_window
        state: 'on'
    then:
    - action: notify.mobile_app_aphone
      data:
        message: Fenster und Tür auf bei Julias Büro.
  mode: restart
