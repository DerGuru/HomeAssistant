- id: '1787656697249'
  alias: Heizung – Warmwasser Anwesenheit
  description: Setzt input_number.currently_set_water_temp auf 35°C, wenn niemand
    da ist (group.alleda / JemandDa -> off), und auf input_number.default_water_temp,
    sobald jemand da ist (-> on).
  triggers:
  - trigger: state
    entity_id: group.alleda
    to: 'off'
    id: away
  - trigger: state
    entity_id: group.alleda
    to: 'on'
    id: home
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - away
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.currently_set_water_temp
        data:
          value: 35
    - conditions:
      - condition: trigger
        id: home
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.currently_set_water_temp
        data:
          value: '{{ states("input_number.default_water_temp") | float(50) }}'
  mode: queued
  max: 10
- id: '1787657671208'
  alias: Heizung – WW-Solltemperatur übernehmen
  description: Übernimmt input_number.currently_set_water_temp in die drei realen
    WW-Sollwert-Entities (speichersolltemp, ww_komf_temp, ww_eco_temp).
  triggers:
  - trigger: state
    entity_id: input_number.currently_set_water_temp
  conditions: []
  actions:
  - action: number.set_value
    target:
      entity_id:
      - number.heizung_speichersolltemp
      - number.heizung_ww_komf_temp
      - number.heizung_ww_eco_temp
    data:
      value: '{{ trigger.to_state.state }}'
  mode: single
- id: '1789546488288'
  alias: Heizung – Programmschalter zentral steuern
  description: 'Ersetzt die 5 frueheren Einzelautomationen (Aussentemp x2, Terrassentuer-zu
    x2 [darunter ein Copy-Paste-Bug-Duplikat], Terrassentuer-auf). Alle 4 Trigger
    (Aussentemp geaendert, Tuer auf, Tuer zu, Verdichter aus) rufen ohne jede Sonderlogik
    direkt script.heizung_programmziel_bestimmen auf. Aussentemp-Trigger haengt bewusst
    an sensor.heizung_aussentemp_gerundet (auf 0,5 C gerundeter Template-Helfer) statt
    am Rohsensor, damit nicht jeder Mini-Tick (im Schnitt alle 6-7 Min, in Buendeln
    auch dichter) neu bewertet - das Script selbst liest fuer die eigentliche Schwellwert-Pruefung
    weiterhin den ungerundeten Rohsensor sensor.heizung_aussentemp. Kein wait_for_trigger/Timeout
    mehr noetig: das Script hat selbst ein verdichter==off-Gate in der Tuer-offen-Regel,
    dadurch loest der Verdichter-aus-Trigger die Neubewertung von selbst aus, sobald
    der Verdichter stoppt - unabhaengig davon, wie lange das dauert (keine 15-Minuten-Deckelung
    mehr).'
  triggers:
  - trigger: state
    entity_id: sensor.heizung_aussentemp_gerundet
    id: aussentemp_geaendert
  - trigger: state
    entity_id: binary_sensor.terassentur
    to: 'off'
    id: tuer_zu
  - trigger: state
    entity_id: binary_sensor.terassentur
    to: 'on'
    id: tuer_auf
  - trigger: state
    entity_id: binary_sensor.heizung_verdichter
    to: 'off'
    id: verdichter_aus
  actions:
  - action: script.heizung_programmziel_bestimmen
  mode: queued
  max: 10
- id: '1790088535206'
  alias: Waschmaschine ist fertig
  description: Benachrichtigt per aPhone-Push und TTS am KüchenPod, sobald die Waschmaschine
    (sensor.waschmaschine_power) nach einem Waschgang wieder auf ~0 W fällt.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.waschmaschine_power
    below: 5
    for:
      minutes: 2
    enabled: false
  - trigger: state
    entity_id:
    - sensor.waschmaschine_operation_state
    from:
    - run
    to:
    - finished
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.aphone
    data:
      message: Waschmaschine ist fertig
  - action: script.tts_with_volume
    data:
      msg: Waschmaschine ist fertig
      target_device: 2bcd073e7826d5b9ad641dcd745812a5
      target_volume: 0.8
  mode: single
- id: '1790088828218'
  alias: Wäschetrockner ist fertig
  description: Benachrichtigt per aPhone-Push und TTS am KüchenPod, sobald der Trockner
    (sensor.trockner_power) nach einem Trockengang wieder auf ~0 W fällt.
  triggers:
  - below: 5
    entity_id:
    - sensor.trockner_power
    for:
      minutes: 2
    trigger: numeric_state
  actions:
  - action: notify.send_message
    data:
      message: Die Wäsche ist trocken.
    target:
      entity_id: notify.aphone
  - action: script.tts_with_volume
    data:
      msg: Die Wäsche ist trocken.
      target_device: 2bcd073e7826d5b9ad641dcd745812a5
      target_volume: 0.8
  mode: single
- id: '1792313316323'
  alias: Heizung – WW-Hysterese Abendboost
  description: '20:00: WW-Hysterese auf 1 K, damit der Speicher abends bei ca. 54
    °C nachlädt (Soll 55 °C). Sobald die Warmwasserbereitung danach wieder aus ist,
    Hysterese zurück auf input_number.default_hysterese. Nicht während des Legionellenprogramms.'
  triggers:
  - at: '20:00:00'
    id: abend_start
    trigger: time
  - entity_id: binary_sensor.heizung_warmwasserbereitung
    from: 'on'
    id: ladung_fertig
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - choose:
    - alias: 20:00 – Hysterese auf 1 K
      conditions:
      - condition: trigger
        id: abend_start
      sequence:
      - action: number.set_value
        data:
          value: 1
        target:
          entity_id: number.heizung_ww_hysterese
    - alias: Ladung fertig – Hysterese zurück auf Default
      conditions:
      - condition: trigger
        id: ladung_fertig
      - condition: numeric_state
        entity_id: number.heizung_ww_hysterese
        below: input_number.default_hysterese
      - condition: state
        entity_id: script.legionellenprogramm_warmwasser
        state: 'off'
      sequence:
      - action: number.set_value
        data:
          value: '{{ states(''input_number.default_hysterese'') | float(10) }}'
        target:
          entity_id: number.heizung_ww_hysterese
  mode: queued
