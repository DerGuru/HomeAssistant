- id: '1776798325469'
  alias: Licht – Schlafzimmer (Shortcut)
  description: Shortcut-Button via event.schlafzimmer_shortcut (ZHA→Event-Entity,
    device_ieee 70:ac:08:ff:fe:e0:42:a3). single=toggle, hold=zirkuläres Dimmen, release=Stop
    (mode restart), double=1%<->100%.
  triggers:
  - trigger: event.received
    target:
      entity_id: event.schlafzimmer_shortcut
    options:
      event_type:
      - single
    id: single
  - trigger: event.received
    target:
      entity_id: event.schlafzimmer_shortcut
    options:
      event_type:
      - double
    id: double
  - trigger: event.received
    target:
      entity_id: event.schlafzimmer_shortcut
    options:
      event_type:
      - hold
    id: hold
  - trigger: event.received
    target:
      entity_id: event.schlafzimmer_shortcut
    options:
      event_type:
      - release
    id: release
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: single
      sequence:
      - action: light.toggle
        target:
          entity_id: light.schlafzimmer_deckenlampe
    - conditions:
      - condition: trigger
        id: double
      sequence:
      - else:
        - action: light.turn_on
          data:
            brightness_pct: 1
            transition: 0.3
          target:
            entity_id: light.schlafzimmer_deckenlampe
        if:
        - attribute: brightness
          below: 8
          condition: numeric_state
          entity_id: light.schlafzimmer_deckenlampe
        then:
        - action: light.turn_on
          data:
            brightness_pct: 100
            transition: 0.3
          target:
            entity_id: light.schlafzimmer_deckenlampe
    - conditions:
      - condition: trigger
        id: hold
      sequence:
      - repeat:
          count: 200
          sequence:
          - action: light.turn_on
            data:
              brightness_step_pct: '{{ 5 if ((repeat.index - 1) % 40) < 20 else -5
                }}'
              transition: 0.3
            target:
              entity_id: light.schlafzimmer_deckenlampe
          - delay:
              milliseconds: 300
  mode: restart
