- id: '1787656697249'
  alias: Heizung – Warmwasser Anwesenheit
  description: Setzt input_number.currently_set_water_temp auf 35°C, wenn niemand
    da ist (group.alleda / JemandDa -> off), und auf input_number.default_water_temp,
    sobald jemand da ist (-> on).
  triggers:
  - trigger: state
    entity_id: group.alleda
    to: 'off'
    id: away
  - trigger: state
    entity_id: group.alleda
    to: 'on'
    id: home
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: away
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.currently_set_water_temp
        data:
          value: 35
    - conditions:
      - condition: trigger
        id: home
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.currently_set_water_temp
        data:
          value: '{{ states("input_number.default_water_temp") | float(50) }}'
  mode: queued
  max: 10
- id: '1787657671208'
  alias: Heizung – WW-Solltemperatur übernehmen
  description: Übernimmt input_number.currently_set_water_temp in die drei realen
    WW-Sollwert-Entities (speichersolltemp, ww_komf_temp, ww_eco_temp).
  triggers:
  - trigger: state
    entity_id: input_number.currently_set_water_temp
  conditions: []
  actions:
  - action: number.set_value
    target:
      entity_id:
      - number.heizung_speichersolltemp
      - number.heizung_ww_komf_temp
      - number.heizung_ww_eco_temp
    data:
      value: '{{ trigger.to_state.state }}'
  mode: single
- id: '1789546488288'
  alias: Heizung – Programmschalter zentral steuern
  description: 'Ersetzt die 5 frueheren Einzelautomationen (Aussentemp x2, Terrassentuer-zu
    x2 [darunter ein Copy-Paste-Bug-Duplikat], Terrassentuer-auf). Alle 4 Trigger
    (Aussentemp geaendert, Tuer auf, Tuer zu, Verdichter aus) rufen ohne jede Sonderlogik
    direkt script.heizung_programmziel_bestimmen auf. Aussentemp-Trigger haengt bewusst
    an sensor.heizung_aussentemp_gerundet (auf 0,5 C gerundeter Template-Helfer) statt
    am Rohsensor, damit nicht jeder Mini-Tick (im Schnitt alle 6-7 Min, in Buendeln
    auch dichter) neu bewertet - das Script selbst liest fuer die eigentliche Schwellwert-Pruefung
    weiterhin den ungerundeten Rohsensor sensor.heizung_aussentemp. Kein wait_for_trigger/Timeout
    mehr noetig: das Script hat selbst ein verdichter==off-Gate in der Tuer-offen-Regel,
    dadurch loest der Verdichter-aus-Trigger die Neubewertung von selbst aus, sobald
    der Verdichter stoppt - unabhaengig davon, wie lange das dauert (keine 15-Minuten-Deckelung
    mehr).'
  triggers:
  - trigger: state
    entity_id: sensor.heizung_aussentemp_gerundet
    id: aussentemp_geaendert
  - trigger: state
    entity_id: binary_sensor.terassentur
    to: 'off'
    id: tuer_zu
  - trigger: state
    entity_id: binary_sensor.terassentur
    to: 'on'
    id: tuer_auf
  - trigger: state
    entity_id: binary_sensor.heizung_verdichter
    to: 'off'
    id: verdichter_aus
  actions:
  - action: script.heizung_programmziel_bestimmen
  mode: queued
  max: 10
