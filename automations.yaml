    - conditions:
      - condition: trigger
        id: button_2_release
      sequence: []
    - conditions:
      - condition: trigger
        id: button_2_double
      sequence: []
    - conditions:
      - condition: trigger
        id: button_3_single
      sequence:
      - action: light.toggle
        metadata: {}
        target:
          entity_id: light.wohnzimmerlicht_switch_0
        data: {}
    - conditions:
      - condition: trigger
        id: button_3_hold
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ true }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ target_light }}'
            data:
              brightness_step_pct: -{{ dim_step_pct }}
          - delay:
              milliseconds: '{{ dim_delay_ms }}'
    - conditions:
      - condition: trigger
        id: button_3_double
      sequence:
      - action: light.turn_off
        target:
          entity_id: '{{ target_light }}'
    enabled: true
  variables:
    target_light: light.standardbeleuchtung
    dim_step_pct: 10
    dim_delay_ms: 100
  mode: restart
