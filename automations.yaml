    value_template: '{{ trigger.to_state.state in [''on'',''off''] }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''switch.lichtschalter_schlafzimmer''
          }}'
      - condition: template
        value_template: '{{ states(''light.schlafzimmer_deckenlampe'') != states(''switch.lichtschalter_schlafzimmer'')
          }}

          '
      sequence:
      - target:
          entity_id: light.schlafzimmer_deckenlampe
        action: light.turn_{{ trigger.to_state.state }}
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''light.schlafzimmer_deckenlampe''
          }}'
      - condition: template
        value_template: '{{ states(''switch.lichtschalter_schlafzimmer'') != states(''light.schlafzimmer_deckenlampe'')
          }}

          '
      sequence:
      - target:
          entity_id: switch.lichtschalter_schlafzimmer
        action: switch.turn_{{ trigger.to_state.state }}
