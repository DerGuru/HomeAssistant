- id: '1772186038644'
  alias: Heizung – HA-Start Sync
  description: HA Start Heizungsteuerung setzt initialen State
  triggers:
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - wait_template: "{{\n  states('sensor.heizung_vorlaufisttemp') not in ['unknown','unavailable','']\n
      \ and states('sensor.heizung_ruecklaufisttemp') not in ['unknown','unavailable','']\n
      \ and states('switch.bad_og_heizkreisventil') not in ['unknown','unavailable','']\n
      \ and states('switch.arbeitszimmer_eg_heizkreisventil') not in ['unknown','unavailable','']\n
      \ and states('switch.arbeitszimmer_og_heizkreisventil') not in ['unknown','unavailable','']\n
      \ and states('switch.kinderzimmer_heizkreisventil') not in ['unknown','unavailable','']\n
      \ and states('switch.schlafzimmer_heizkreisventil') not in ['unknown','unavailable','']\n}}"
    timeout: 00:15:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.completed }}'
      sequence:
      - data:
          level: warning
          message: 'StartCheck OK: Heizkreis-Entities sind verfügbar. Modus={{ states(''sensor.heizungsbetriebsmodus'')
            }}'
        action: system_log.write
    default:
    - data:
        level: error
        message: 'StartCheck TIMEOUT: Heizkreis-Entities nicht vollständig verfügbar.'
      action: system_log.write
    - stop: HaStartSync abgebrochen wegen Timeout
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.heizungsbetriebsmodus
        state: Cooling
      sequence:
      - target:
          entity_id: switch.bad_og_heizkreisventil
        action: switch.turn_off
    default:
    - target:
        entity_id: switch.bad_og_heizkreisventil
      action: switch.turn_on
  - action: script.setheizkreisventilebetriebsmodus
    data: {}
  mode: single
