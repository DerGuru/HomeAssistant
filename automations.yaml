- id: letsencrypt_erneuern_und_neustart
  alias: 'Zertifikat: Let''s Encrypt erneuern und HA neu laden'
  description: 'Täglich 03:00: Läuft das ausgelieferte Zertifikat in weniger als 10
    Tagen ab (oder ist ungültig/abgelaufen), startet das Let''s-Encrypt-App (force_renew),
    danach wird HA neu gestartet. Der Sensor wird alle 12 h aktualisiert, die Restlaufzeit
    kann also minimal ~9,5 Tage betragen.'
  triggers:
  - trigger: time
    at: 03:00:00
  conditions:
  - condition: template
    value_template: '{% set s = states(''sensor.homeassistant_jakof_eu_cert_expiry'')
      %}{{ s != ''unavailable'' and (s == ''unknown'' or (s | as_datetime - now()).total_seconds()
      < 864000) }}'
  actions:
  - action: hassio.app_start
    data:
      app: core_letsencrypt
  - delay:
      minutes: 5
  - action: homeassistant.restart
  mode: single
